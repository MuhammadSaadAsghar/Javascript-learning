<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Download Simulation</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #0f172a;
      font-family: Arial, sans-serif;
      color: white;
    }

    .container {
      width: 350px;
      padding: 20px;
      background: #1e293b;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 0 20px rgba(0,0,0,0.5);
    }

    h2 {
      margin-bottom: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 20px;
      background: #334155;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .progress {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      /* animation: download 5s linear forwards; */
    }

    .text {
      font-size: 14px;
      opacity: 0.8;
    }

  </style>
</head>
<body>

  <div class="container">
    <h2>Downloading...</h2>
    
    <div class="progress-bar">
      <div class="progress"></div>
    </div>

    <div class="text">0%</div>
  </div>
<script src="script.js"></script>
</body>
</html>
